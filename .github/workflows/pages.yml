# 把 docs/ (BuildWeb.bat 建好的網頁版) 發佈到 GitHub Pages。
# GitHub 網站上 Settings → Pages → Source 要選「GitHub Actions」。
# 網頁版很大 (60 MB 以上)，發佈等待時間放寬到 30 分鐘 (預設 10 分鐘常常逾時)。
name: 發佈網頁版

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
